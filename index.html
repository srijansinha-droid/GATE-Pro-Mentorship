<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GATE Pro Mentorship</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --success-hover: #059669;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
        }

        /* Common Card Style */
        .container {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Login Container (Small) */
        #loginSection {
            max-width: 450px;
        }

        /* Form Container (Wide) */
        #mainSection {
            max-width: 1000px; /* Form ki width badha di */
            min-height: 80vh; /* Taaki button niche chala jaye */
            display: none; /* JS se block karenge */
        }

        h2 {
            color: var(--text-main);
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            color: var(--text-main);
            background-color: #f8fafc;
            transition: 0.3s;
        }

        .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            outline: none;
        }

        textarea { resize: vertical; height: 80px; }

        /* Button Styles */
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-primary { background: var(--primary); }
        .btn-primary:hover { background: var(--primary-hover); }

        .btn-success { background: var(--success); }
        .btn-success:hover { background: var(--success-hover); }

        .btn-secondary { background: #e2e8f0; color: var(--text-main); }
        .btn-secondary:hover { background: #cbd5e1; }

        /* Header inside Form */
        .form-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 15px;
        }

        .form-header h2 { margin: 0; text-align: left; }
        
        .logout-btn {
            padding: 8px 16px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: auto;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        /* Form Layout (For pushing button down) */
        .tab-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .form-body {
            flex: 1;
        }

        .submit-container {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        /* Spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Messages */
        .msg { padding: 12px; border-radius: 8px; margin-top: 15px; display: none; font-size: 14px; text-align: center; font-weight: 500; }
        .error-msg { background: #fee2e2; color: #991b1b; }
        .success-msg { background: #d1fae5; color: #065f46; }

        /* Table */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { background: #f8fafc; color: var(--text-muted); }
    </style>
</head>
<body>

    <!-- LOGIN SECTION (Small & Centered) -->
    <div class="container" id="loginSection">
        <h2>Student Login</h2>
        <div class="input-group">
            <label>User ID</label>
            <input type="text" id="loginUserId" placeholder="Enter your 24-character User ID">
        </div>
        <div class="input-group">
            <label>Phone Number</label>
            <input type="tel" id="loginPhone" placeholder="Enter 10-digit registered phone number">
        </div>
        
        <button class="btn btn-primary" id="loginBtn" onclick="handleLogin()">
            <span class="spinner" id="loginSpinner"></span>
            <span id="loginBtnText">Login</span>
        </button>
        
        <div class="msg error-msg" id="loginError"></div>
    </div>

    <!-- MAIN FORM SECTION (Wide) -->
    <div class="container" id="mainSection">
        
        <div class="form-header">
            <h2>Welcome, <span id="displayName" style="color: var(--primary);">Student</span></h2>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="btn btn-primary" onclick="showTab('bookTab')" id="tabBookBtn">Book Mentorship</button>
            <button class="btn btn-secondary" onclick="showTab('scheduleTab')" id="tabScheduleBtn">My Schedule</button>
        </div>

        <!-- BOOKING FORM TAB -->
        <div id="bookTab" class="tab-content">
            <div class="form-body">
                <div class="input-group"><label>Name</label><input type="text" id="name"></div>
                <div class="input-group"><label>Branch</label><select id="branch" onchange="fetchFaculties()"></select></div>
                <div class="input-group"><label>Faculty</label><select id="faculty"></select></div>
                <div class="input-group"><label>Date (DD/MM/YYYY)</label><input type="text" id="date" placeholder="e.g. 25/12/2026"></div>
                <div class="input-group">
                    <label>Time Slot</label>
                    <select id="time">
                        <option value="10:00 AM">10:00 AM</option>
                        <option value="11:00 AM">11:00 AM</option>
                        <option value="02:00 PM">02:00 PM</option>
                        <option value="04:00 PM">04:00 PM</option>
                    </select>
                </div>
                <div class="input-group"><label>Target Year</label><select id="targetYear"><option>2025</option><option>2026</option></select></div>
                <div class="input-group"><label>Batch Name</label><input type="text" id="batchName"></div>
                <div class="input-group"><label>Query</label><textarea id="query"></textarea></div>
            </div>
            
            <!-- Button pushed to bottom -->
            <div class="submit-container">
                <button class="btn btn-success" id="bookBtn" onclick="handleBooking()">
                    <span class="spinner" id="bookSpinner"></span>
                    <span id="bookBtnText">Book Now</span>
                </button>
                <div class="msg error-msg" id="bookError"></div>
                <div class="msg success-msg" id="bookSuccess"></div>
            </div>
        </div>

        <!-- SCHEDULE TAB -->
        <div id="scheduleTab" class="tab-content" style="display: none;">
            <div class="table-container">
                <table>
                    <thead>
                        <tr><th>Booking ID</th><th>Date & Time</th><th>Faculty</th><th>Status</th><th>Link</th></tr>
                    </thead>
                    <tbody id="scheduleBody"></tbody>
                </table>
            </div>
            <div class="msg error-msg" id="scheduleError" style="margin-top: 20px;"></div>
        </div>

    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbynme6uRDu_phDJ8AW5B3wN5fX_JsW-voHBoiUntEG3CYQIoOieKS-KsmNfeBqekTZRsA/exec"; // <-- APNA URL DAALEIN
        let currentStudentId = null;

        window.onload = function() {
            const saved = localStorage.getItem('studentId');
            if (saved) { currentStudentId = saved; showMainSection(); }
        };

        function handleLogin() {
            const userId = document.getElementById('loginUserId').value.trim();
            const phone = document.getElementById('loginPhone').value.trim();
            const btn = document.getElementById('loginBtn');
            const spinner = document.getElementById('loginSpinner');
            const btnText = document.getElementById('loginBtnText');
            const err = document.getElementById('loginError');

            if(!userId || !phone) { err.innerText = "Please enter all details."; err.style.display = 'block'; return; }

            // Spinner ON
            spinner.style.display = 'inline-block';
            btnText.innerText = "Verifying...";
            btn.disabled = true; 
            err.style.display = 'none';

            fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "login", data: { userId, phone } }) })
            .then(res => res.json())
            .then(data => {
                // Spinner OFF
                spinner.style.display = 'none';
                btnText.innerText = "Login";
                btn.disabled = false;

                if (data.success) {
                    currentStudentId = data.studentId;
                    localStorage.setItem('studentId', data.studentId);
                    localStorage.setItem('studentName', data.name);
                    showMainSection();
                } else {
                    err.innerText = data.message; err.style.display = 'block';
                }
            })
            .catch(e => {
                spinner.style.display = 'none'; btnText.innerText = "Login"; btn.disabled = false;
                err.innerText = "Network error. Try again."; err.style.display = 'block';
            });
        }

        function showMainSection() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('mainSection').style.display = 'flex';
            document.getElementById('displayName').innerText = localStorage.getItem('studentName') || 'Student';
            document.getElementById('name').value = localStorage.getItem('studentName') || '';
            loadBranches();
        }

        function logout() { localStorage.clear(); window.location.reload(); }

        function showTab(tabId) {
            document.getElementById('bookTab').style.display = 'none';
            document.getElementById('scheduleTab').style.display = 'none';
            document.getElementById(tabId).style.display = 'flex'; // Flex for layout

            // Tab styling toggle
            if(tabId === 'bookTab') {
                document.getElementById('tabBookBtn').className = "btn btn-primary";
                document.getElementById('tabScheduleBtn').className = "btn btn-secondary";
            } else {
                document.getElementById('tabScheduleBtn').className = "btn btn-primary";
                document.getElementById('tabBookBtn').className = "btn btn-secondary";
                loadSchedule();
            }
        }

        function loadBranches() {
            fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "getBranches" }) })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    const sel = document.getElementById('branch');
                    sel.innerHTML = '<option value="">Select Branch</option>';
                    data.data.forEach(b => sel.innerHTML += `<option value="${b}">${b}</option>`);
                }
            });
        }

        function fetchFaculties() {
            const branch = document.getElementById('branch').value;
            const sel = document.getElementById('faculty');
            sel.innerHTML = '<option>Loading...</option>';
            if(!branch) { sel.innerHTML = '<option value="">Select Branch First</option>'; return; }

            fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "getFaculties", data: { branch } }) })
            .then(res => res.json())
            .then(data => {
                sel.innerHTML = '<option value="">Select Faculty</option>';
                if(data.success) data.data.forEach(f => sel.innerHTML += `<option value="${f}">${f}</option>`);
            });
        }

        function handleBooking() {
            const btn = document.getElementById('bookBtn');
            const spinner = document.getElementById('bookSpinner');
            const btnText = document.getElementById('bookBtnText');
            const err = document.getElementById('bookError');
            const succ = document.getElementById('bookSuccess');
            
            const data = {
                studentId: currentStudentId,
                name: document.getElementById('name').value,
                branch: document.getElementById('branch').value,
                faculty: document.getElementById('faculty').value,
                dateStr: document.getElementById('date').value,
                timeStr: document.getElementById('time').value,
                targetYear: document.getElementById('targetYear').value,
                batchName: document.getElementById('batchName').value,
                query: document.getElementById('query').value
            };

            if(!data.branch || !data.faculty || !data.dateStr || !data.query) {
                err.innerText = "Please fill all required fields."; err.style.display = 'block'; return;
            }

            // Spinner ON
            spinner.style.display = 'inline-block';
            btnText.innerText = "Booking...";
            btn.disabled = true; 
            err.style.display = 'none'; succ.style.display = 'none';

            fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "book", data }) })
            .then(res => res.json())
            .then(res => {
                // Spinner OFF
                spinner.style.display = 'none';
                btnText.innerText = "Book Now";
                btn.disabled = false;

                if(res.success) {
                    succ.innerHTML = `Success! ID: ${res.bookingId}. Monthly limit left: ${res.remainingThisMonth}`;
                    succ.style.display = 'block';
                    document.getElementById('query').value = '';
                } else {
                    err.innerText = res.message; err.style.display = 'block';
                }
            })
            .catch(e => {
                spinner.style.display = 'none'; btnText.innerText = "Book Now"; btn.disabled = false;
                err.innerText = "Network error."; err.style.display = 'block';
            });
        }

        function loadSchedule() {
            const tbody = document.getElementById('scheduleBody');
            const err = document.getElementById('scheduleError');
            
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Loading data...</td></tr>';
            err.style.display = 'none';

            fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "getBookings", data: { studentId: currentStudentId } }) })
            .then(res => res.json())
            .then(res => {
                if(res.success) {
                    tbody.innerHTML = '';
                    if(res.data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No records found.</td></tr>';
                        return;
                    }
                    res.data.forEach(b => {
                        let color = b.status === 'Booked' ? '#10b981' : '#ef4444';
                        let meetLink = b.meetingLink ? `<a href="${b.meetingLink}" target="_blank">Join</a>` : '-';
                        tbody.innerHTML += `
                            <tr>
                                <td><b>${b.bookingId}</b></td>
                                <td>${b.date} <br> <small style="color:#64748b">${b.time}</small></td>
                                <td>${b.faculty}</td>
                                <td style="color:${color}; font-weight:bold;">${b.status}</td>
                                <td>${meetLink}</td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = '';
                    err.innerText = res.message; err.style.display = 'block';
                }
            });
        }
    </script>
</body>
</html>
