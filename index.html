<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GATE Pro Mentorship</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ... (Yahan wahi CSS rahega jo pichli baar diya tha) ... */
        :root { --primary: #6366f1; --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); --card-bg: rgba(255, 255, 255, 0.95); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg-gradient); display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 40px 20px; }
        .container { background: var(--card-bg); padding: 40px; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); width: 100%; max-width: 800px; }
        h2 { text-align: center; margin-bottom: 20px; color: #1e293b; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: 600; color: #64748b; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; margin-top: 10px; }
        .btn-primary { background: #6366f1; } .btn-success { background: #10b981; } .btn-secondary { background: #64748b; }
        .header-actions { display: flex; gap: 10px; margin-bottom: 20px; }
        
        /* Table Style */
        .table-container { overflow-x: auto; margin-top: 20px; display: none; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { background: #f8fafc; color: #475569; font-weight: 600; }
        tr:hover { background: #f1f5f9; }
        .status-booked { color: #10b981; font-weight: bold; }
        .status-cancelled { color: #ef4444; font-weight: bold; }
        
        .msg { font-size: 14px; text-align: center; margin-top: 15px; display: none; padding: 10px; border-radius: 5px; }
        .error-msg { color: #991b1b; background: #fee2e2; }
        .success-msg { color: #065f46; background: #d1fae5; }
    </style>
</head>
<body>

    <div class="container">
        <!-- LOGIN SECTION -->
        <div id="loginSection">
            <h2>Student Login</h2>
            <div class="input-group"><label>User ID</label><input type="text" id="loginUserId"></div>
            <div class="input-group"><label>Phone Number</label><input type="tel" id="loginPhone"></div>
            <button class="btn btn-primary" id="loginBtn" onclick="handleLogin()">Login</button>
            <div class="msg error-msg" id="loginError"></div>
        </div>

        <!-- MAIN APP (After Login) -->
        <div id="mainSection" style="display: none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 style="margin:0;">Welcome, <span id="displayName">Student</span></h2>
                <button class="btn btn-secondary" style="width:auto; padding: 8px 16px; margin:0;" onclick="logout()">Logout</button>
            </div>

            <!-- Tabs -->
            <div class="header-actions">
                <button class="btn btn-primary" onclick="showTab('bookTab')">Book Mentorship</button>
                <button class="btn btn-success" onclick="showTab('scheduleTab')">My Schedule</button>
            </div>

            <!-- BOOKING FORM TAB -->
            <div id="bookTab">
                <div class="input-group"><label>Name</label><input type="text" id="name"></div>
                <div class="input-group"><label>Branch</label><select id="branch" onchange="fetchFaculties()"></select></div>
                <div class="input-group"><label>Faculty</label><select id="faculty"></select></div>
                <div class="input-group"><label>Date (DD/MM/YYYY)</label><input type="text" id="date" placeholder="e.g. 25/12/2026"></div>
                <div class="input-group"><label>Time Slot</label>
                    <select id="time">
                        <option value="10:00 AM">10:00 AM</option><option value="11:00 AM">11:00 AM</option>
                        <option value="02:00 PM">02:00 PM</option><option value="04:00 PM">04:00 PM</option>
                    </select>
                </div>
                <div class="input-group"><label>Target Year</label><select id="targetYear"><option>2025</option><option>2026</option></select></div>
                <div class="input-group"><label>Batch Name</label><input type="text" id="batchName"></div>
                <div class="input-group"><label>Query</label><textarea id="query"></textarea></div>
                <button class="btn btn-success" id="bookBtn" onclick="handleBooking()">Book Now</button>
                <div class="msg error-msg" id="bookError"></div>
                <div class="msg success-msg" id="bookSuccess"></div>
            </div>

            <!-- SCHEDULE TAB -->
            <div id="scheduleTab" style="display: none;">
                <div class="table-container" id="tableContainer">
                    <table>
                        <thead>
                            <tr>
                                <th>Booking ID</th>
                                <th>Date & Time</th>
                                <th>Faculty</th>
                                <th>Status</th>
                                <th>Meeting Link</th>
                            </tr>
                        </thead>
                        <tbody id="scheduleBody">
                            <!-- Data will load here -->
                        </tbody>
                    </table>
                </div>
                <div class="msg error-msg" id="scheduleError"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbynme6uRDu_phDJ8AW5B3wN5fX_JsW-voHBoiUntEG3CYQIoOieKS-KsmNfeBqekTZRsA/exec"; // <-- PASTE URL HERE
        let currentStudentId = null;

        window.onload = function() {
            const saved = localStorage.getItem('studentId');
            if (saved) { currentStudentId = saved; showMainSection(); }
        };

        function handleLogin() {
            const userId = document.getElementById('loginUserId').value;
            const phone = document.getElementById('loginPhone').value;
            const btn = document.getElementById('loginBtn');
            const err = document.getElementById('loginError');

            btn.innerText = "Logging in..."; btn.disabled = true; err.style.display = 'none';

            fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "login", data: { userId, phone } }) })
            .then(res => res.json())
            .then(data => {
                btn.innerText = "Login"; btn.disabled = false;
                if (data.success) {
                    currentStudentId = data.studentId;
                    localStorage.setItem('studentId', data.studentId);
                    localStorage.setItem('studentName', data.name);
                    showMainSection();
                } else {
                    err.innerText = data.message; err.style.display = 'block';
                }
            });
        }

        function showMainSection() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('mainSection').style.display = 'block';
            document.getElementById('displayName').innerText = localStorage.getItem('studentName') || 'Student';
            document.getElementById('name').value = localStorage.getItem('studentName') || '';
            loadBranches();
        }

        function logout() {
            localStorage.clear();
            window.location.reload();
        }

        function showTab(tabId) {
            document.getElementById('bookTab').style.display = 'none';
            document.getElementById('scheduleTab').style.display = 'none';
            document.getElementById(tabId).style.display = 'block';

            if (tabId === 'scheduleTab') {
                loadSchedule();
            }
        }

        function loadBranches() {
            fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "getBranches" }) })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    const sel = document.getElementById('branch');
                    sel.innerHTML = '<option value="">Select Branch</option>';
                    data.data.forEach(b => sel.innerHTML += `<option value="${b}">${b}</option>`);
                }
            });
        }

        function fetchFaculties() {
            const branch = document.getElementById('branch').value;
            const sel = document.getElementById('faculty');
            sel.innerHTML = '<option>Loading...</option>';
            if(!branch) { sel.innerHTML = '<option value="">Select Branch First</option>'; return; }

            fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "getFaculties", data: { branch } }) })
            .then(res => res.json())
            .then(data => {
                sel.innerHTML = '<option value="">Select Faculty</option>';
                if(data.success) data.data.forEach(f => sel.innerHTML += `<option value="${f}">${f}</option>`);
            });
        }

        function handleBooking() {
            const btn = document.getElementById('bookBtn');
            const err = document.getElementById('bookError');
            const succ = document.getElementById('bookSuccess');
            const data = {
                studentId: currentStudentId,
                name: document.getElementById('name').value,
                branch: document.getElementById('branch').value,
                faculty: document.getElementById('faculty').value,
                dateStr: document.getElementById('date').value,
                timeStr: document.getElementById('time').value,
                targetYear: document.getElementById('targetYear').value,
                batchName: document.getElementById('batchName').value,
                query: document.getElementById('query').value
            };

            btn.innerText = "Processing..."; btn.disabled = true; err.style.display = 'none'; succ.style.display = 'none';

            fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "book", data }) })
            .then(res => res.json())
            .then(res => {
                btn.innerText = "Book Now"; btn.disabled = false;
                if(res.success) {
                    succ.innerHTML = `Success! Booking ID: ${res.bookingId}. Remaining limit: ${res.remainingThisMonth}`;
                    succ.style.display = 'block';
                } else {
                    err.innerText = res.message; err.style.display = 'block';
                }
            });
        }

        function loadSchedule() {
            const tableBody = document.getElementById('scheduleBody');
            const container = document.getElementById('tableContainer');
            const err = document.getElementById('scheduleError');
            
            tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Loading...</td></tr>';
            container.style.display = 'block';
            err.style.display = 'none';

            fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "getBookings", data: { studentId: currentStudentId } }) })
            .then(res => res.json())
            .then(res => {
                if(res.success) {
                    tableBody.innerHTML = '';
                    if(res.data.length === 0) {
                        tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No bookings found.</td></tr>';
                        return;
                    }
                    res.data.forEach(b => {
                        let statusClass = b.status === 'Booked' ? 'status-booked' : 'status-cancelled';
                        let meetLink = b.meetingLink ? `<a href="${b.meetingLink}" target="_blank">Join</a>` : '-';
                        tableBody.innerHTML += `
                            <tr>
                                <td>${b.bookingId}</td>
                                <td>${b.date} <br> <small>${b.time}</small></td>
                                <td>${b.faculty}</td>
                                <td class="${statusClass}">${b.status}</td>
                                <td>${meetLink}</td>
                            </tr>
                        `;
                    });
                } else {
                    container.style.display = 'none';
                    err.innerText = res.message; err.style.display = 'block';
                }
            });
        }
    </script>
</body>
</html>
